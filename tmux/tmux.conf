set -g allow-passthrough on

# tmux's default status-right is:
#   "#{=21:pane_title}" %H:%M %d-%b-%y
# and pane_title defaults to the hostname, so every screenshot and screen
# recording carries the name of this machine along the bottom edge. Keep the
# clock, drop the title.
set -g status-right ' %H:%M '

# Mouse: click to select panes/windows, drag borders to resize, scroll to
# enter copy-mode and scroll back through history.
set -g mouse on

# nvim inside tmux: no esc delay, true color, focus events for autoread.
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"

set -g base-index 1
setw -g pane-base-index 1

# Splits like vim's <C-w>v / <C-w>s, opening in the current directory.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + H/J/K/L resizes (repeatable).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi copy mode: v selects, y yanks to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy

# ctrl-h/j/k/l moves across tmux panes and nvim splits (nvim side: smart-splits.nvim).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# ctrl-l is taken above, so clear-screen moves to prefix + ctrl-l.
bind C-l send-keys C-l
