# kitty = OS windows, tabs and panes. Window mgmt lives in AeroSpace (alt-*).
# kitty_mod is ctrl+shift (default).

font_size 14.0
enable_audio_bell no
confirm_os_window_close 0
hide_window_decorations titlebar-only
tab_bar_edge top
tab_bar_style powerline

# Tabs, vim-style. Replaces show_scrollback (search is still kitty_mod+/) and next_layout.
map kitty_mod+h previous_tab
map kitty_mod+l next_tab
map kitty_mod+t new_tab_with_cwd
# kitty_mod+j / kitty_mod+k already scroll line down / up by default.

# Panes: cmd+hjkl moves between kitty panes. When the pane runs nvim (smart-splits.nvim sets
# IS_NVIM), the key goes to nvim as ctrl+hjkl instead; nvim moves between its splits and asks
# kitty to switch panes at the edge, over the socket below. Replaces cmd+h hide / cmd+k clear.
# listen_on is read at startup only: quit and reopen kitty after changing it.
allow_remote_control socket-only
listen_on unix:/tmp/kitty
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right
map --when-focus-on var:IS_NVIM cmd+h send_key ctrl+h
map --when-focus-on var:IS_NVIM cmd+j send_key ctrl+j
map --when-focus-on var:IS_NVIM cmd+k send_key ctrl+k
map --when-focus-on var:IS_NVIM cmd+l send_key ctrl+l
